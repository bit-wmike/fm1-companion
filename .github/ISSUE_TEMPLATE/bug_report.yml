name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your report! **Please do not report security vulnerabilities here** – report them privately (see SECURITY.md).

        **Before you attach anything:** The app's error report (Hilfe › Diagnose › "Fehlerbericht speichern" – Help ›
        Diagnostics › Save error report) is a ZIP. The app removes tokens, passwords, host names, home paths and full
        serial numbers – still, take a quick look inside before you upload it. **Never paste a GitHub token or password into an issue.**
  - type: input
    id: version
    attributes:
      label: Suite version
      description: "`fm1-companion --version` or Hilfe › Über (Help › About)"
      placeholder: "2.4.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: "e.g. Raspberry Pi OS Bookworm (Pi 5), Ubuntu 24.04, KDE Plasma 6"
  - type: input
    id: device
    attributes:
      label: FM-1 and firmware (if involved)
      placeholder: "e.g. Melodee 1.6.0, SLOOP 2.8, original V15 – or: no device / demo mode"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message / log (optional)
      description: Only the relevant lines. Check for tokens and personal data first.
      render: text
