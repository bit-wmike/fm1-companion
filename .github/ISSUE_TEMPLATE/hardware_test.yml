name: Hardware test report
description: You tried a function on a real FM-1 – whether it worked or not.
labels: ["hardware-test"]
body:
  - type: markdown
    attributes:
      value: |
        Test reports from real hardware help most (see docs/UNTESTED.md). Please only test with a backup and at
        your own risk. Do not include serial numbers, tokens or personal data.
  - type: input
    id: version
    attributes:
      label: Suite version
      placeholder: "2.3.2"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Model/revision, if known (e.g. flash chip according to "Ist mein FM-1 sauber?" – Is my FM-1 clean?)
      placeholder: "M-VAVE FM-1"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware before → after
      placeholder: "e.g. original V15 → Melodee 1.6.0"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer and system
      placeholder: "e.g. Raspberry Pi 5, Raspberry Pi OS Bookworm"
  - type: dropdown
    id: feature
    attributes:
      label: Tested function
      options:
        - Install / switch firmware
        - Back to the original (V15/V16)
        - Finish an interrupted installation (update mode)
        - Rewrite font & factory sounds
        - Rescue level 2 (ROM boot mode)
        - Is my FM-1 clean? / Clean up leftovers
        - Studio – write back to the FM-1
        - Backup / restore
        - Write presets, samples, projects
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - It worked
        - It partly worked
        - It did not work, but the device runs
        - The device no longer started afterwards / had to be rescued
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Details, messages from the app
      render: text
