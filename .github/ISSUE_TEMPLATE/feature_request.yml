name: Feature request / idea
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is it about?
      description: Which problem should be solved, or what would you like to do with the FM-1?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: input
    id: firmware
    attributes:
      label: Affected firmware (if a specific one)
      placeholder: "e.g. Melodee, SLOOP, all"
