# Keeps the GitHub Actions used by the workflows up to date (one pull request a month at most).
# The app itself has no pip or npm dependencies: everything comes from Debian packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI"
    open-pull-requests-limit: 3
