<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLOOP 3 editor</title>
<style>
:root{--bg:#0b0a10;--bg2:#100e17;--panel:#16131f;--panel2:#1f1b2b;--panel3:#2a2439;--line:#2f2940;--ink:#efeaf7;--dim:#9a92ad;--dim2:#6d6680;
  --acc:#ffd23c;--ok:#5ef08a;--bad:#ff6b6b;--warn:#ffb03c;--t1:#50a0ff;--t2:#50e678;--t3:#ffdc3c;--t4:#f078dc;--t5:#ff9628;--r:10px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:inherit}
.dim{color:var(--dim)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
/* the top bar */
#top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
#logo{font-weight:800;letter-spacing:.04em;font-size:18px}#logo span{color:var(--acc)}
#stat{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.chip{background:var(--panel2);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--dim)}.chip b{color:var(--ink)}
#devmsg{min-width:180px;font-weight:600;color:var(--ok)}#devmsg.badm{color:var(--bad)}
.grow{flex:1}
#app{flex:1;display:flex;min-height:0}
/* the tabs */
#tabs{width:168px;background:var(--bg2);border-right:1px solid var(--line);padding:8px 6px;overflow:auto;flex:none}
#tabs button{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:8px;padding:9px 10px;margin:1px 0;cursor:pointer;color:var(--dim);font-weight:600;text-align:left}
#tabs button:hover{background:var(--panel);color:var(--ink)}#tabs button.on{background:var(--panel2);color:var(--acc)}
#tabs button i{font-style:normal;width:18px;text-align:center}
#main{flex:1;overflow:auto;padding:14px 16px 30px}
section.tab{display:none}section.tab.on{display:block}
h2{font-size:17px;margin:2px 0 10px}h3{font-size:12px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
h3 .help{margin-left:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card.wide{grid-column:1/-1}
.sub{font-size:12px;color:var(--dim);margin:-4px 0 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.btn{background:var(--panel3);border:1px solid #3d3552;border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;user-select:none;white-space:nowrap}
.btn:hover{border-color:#5a4f78}.btn.on{background:var(--acc);color:#1a1400;border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#1a1400;border-color:var(--acc)}.btn.red{background:#5a1f26;border-color:#7a2b33}.btn.red.on{background:var(--bad);color:#200}
.btn.grn.on{background:var(--ok);color:#022;border-color:var(--ok)}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{padding:3px 8px;font-size:12px}.btn.big{padding:10px 18px;font-size:15px}
.help{background:none;border:1px solid var(--line);border-radius:50%;width:20px;height:20px;padding:0;font-size:11px;color:var(--dim);cursor:pointer}
.sel,.num,.txt{background:var(--panel2);border:1px solid #3a3450;border-radius:7px;padding:5px 7px;font-size:13px}.num{width:64px}
.helpbox{display:none;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;font-size:12.5px;color:var(--dim);white-space:pre-line}
.helpbox.on{display:block}
/* knobs, faders, meters */
.knob{display:inline-flex;flex-direction:column;align-items:center;width:58px;font-size:11px;color:var(--dim);user-select:none;touch-action:none;cursor:ns-resize}
.knob svg{width:42px;height:42px}.knob .v{color:var(--ink);font-variant-numeric:tabular-nums;font-size:11.5px;height:15px;white-space:nowrap}
.knob.learn,.btn.learn,.fader.learn{outline:2px dashed var(--warn);outline-offset:2px}
.knobs{display:flex;flex-wrap:wrap;gap:6px 4px}
.fader{position:relative;width:34px;height:150px;background:var(--bg2);border-radius:6px;touch-action:none;cursor:ns-resize}
.fader .fill{position:absolute;left:0;right:0;bottom:0;border-radius:6px;opacity:.28}
.fader .cap{position:absolute;left:3px;right:3px;height:14px;background:var(--ink);border-radius:4px}
.meter{width:8px;height:150px;background:var(--bg2);border-radius:4px;position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--ok),#e6f05a 75%,var(--bad))}
/* the mixer */
.strips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.strip{background:var(--panel2);border-radius:9px;padding:8px;min-width:150px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--c,#888)}
.strip .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.strip .eng{font-size:11px;color:var(--c,#888);font-weight:700}
/* patterns */
.pgrid{display:grid;grid-template-columns:90px repeat(8,1fr);gap:4px;align-items:center}
.pad{height:34px;border-radius:7px;background:var(--panel2);border:1px solid #3a3450;cursor:pointer;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
.pad.has{background:color-mix(in srgb,var(--c,#888) 30%,var(--panel2))}.pad.cur{background:var(--c,#888);color:#111}
.pad.next{animation:blink .5s infinite alternate}@keyframes blink{to{background:var(--panel3)}}
.pad.lit{background:var(--acc);color:#111}
.fxpads{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.drumpads{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.drumpads .pad{height:52px;flex-direction:column;font-size:11px}
/* the keys */
#kb{position:relative;height:120px;user-select:none;touch-action:none;margin-top:6px}
#kb .w,#kb .b{position:absolute;top:0;border-radius:0 0 6px 6px;cursor:pointer}
#kb .w{height:120px;background:#e8e4f0;border:1px solid #888}#kb .b{height:74px;background:#1a1722;z-index:2;border:1px solid #000}
#kb .w.down{background:var(--acc)}#kb .b.down{background:#a07f10}#kb span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:10px;color:#666}
/* scenes */
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.scene{height:44px;border-radius:8px;background:var(--panel2);border:1px solid #3a3450;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.scene.has{border-color:var(--t1)}.scene.on{background:var(--t1);color:#001}
/* the sound */
.pgroup{background:var(--panel2);border-radius:9px;padding:8px 10px}
.pgroup h4{margin:0 0 6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.list div{padding:5px 9px;cursor:pointer;border-bottom:1px solid #1d1928;display:flex;gap:8px;align-items:center}
.list div:hover{background:var(--panel2)}.list div.on{background:var(--panel3);color:var(--acc)}.list .cat{color:var(--dim);font-size:11px;margin-left:auto}
.list div.hd{color:var(--acc);font-weight:700;cursor:default;background:var(--panel)}
/* the sequencer */
canvas.roll{width:100%;background:#09080e;border-radius:8px;display:block;touch-action:none;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:8px 0}
.pop{position:fixed;z-index:50;background:var(--panel);border:1px solid #4a4062;border-radius:10px;padding:10px;box-shadow:0 8px 30px #000a;min-width:220px}
table.tb{border-collapse:collapse;font-size:12px;width:100%}table.tb td,table.tb th{padding:3px 5px;border-bottom:1px solid var(--line);text-align:left}
.cell{font-size:12px;padding:3px;border-radius:6px;background:var(--panel2);border:1px solid #3a3450;width:46px}
#log{height:92px;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);padding:5px 12px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;flex:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.slot{background:var(--panel2);border-radius:8px;padding:8px 10px}.slot.on{outline:2px solid var(--acc)}
.pc{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);gap:2px}
.tc{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);gap:2px}.tc input{width:44px;height:30px;border:0;background:none}
#locked{position:fixed;inset:0;z-index:40;display:none;background:#0004;align-items:flex-end;justify-content:center;padding:20px}
#locked.on{display:flex}
body.full #tabs,body.full #log{display:none}
body.simple .adv{display:none}
@media (max-width:760px){#tabs{width:56px}#tabs button span{display:none}.cards{grid-template-columns:1fr}}
</style></head>
<body>
<div id="top">
  <div id="logo">SLOOP <span>3</span> <small class="dim" data-t="editor"></small></div>
  <button class="btn pri" id="con" data-t="connect"></button>
  <div id="stat">
    <span class="chip"><span data-t="fw"></span> <b id="s_ver">-</b></span>
    <span class="chip">P<b id="s_proj">-</b></span>
    <span class="chip"><b id="s_play">■</b> <b id="s_pos">-</b></span>
    <span class="chip"><b id="s_bpm">-</b> BPM</span>
    <span class="chip">CPU <b id="s_cpu">-</b></span>
    <span id="devmsg"></span>
  </div>
  <span class="grow"></span>
  <button class="btn sm" id="b_view"></button>
  <button class="btn sm" id="b_full"></button>
  <button class="btn sm" id="b_lang">FR</button>
</div>
<div id="app">
  <nav id="tabs"></nav>
  <div id="main">
    <section class="tab" id="tab_live"></section>
    <section class="tab" id="tab_sound"></section>
    <section class="tab" id="tab_seq"></section>
    <section class="tab" id="tab_mixer"></section>
    <section class="tab" id="tab_song"></section>
    <section class="tab" id="tab_library"></section>
    <section class="tab" id="tab_samples"></section>
    <section class="tab" id="tab_mkkit"></section>
    <section class="tab" id="tab_kits"></section>
    <section class="tab" id="tab_drumsynth"></section>
    <section class="tab" id="tab_fm6"></section>
    <section class="tab" id="tab_projects"></section>
    <section class="tab" id="tab_settings"></section>
    <section class="tab" id="tab_theme"></section>
  </div>
</div>
<div id="log"></div>
<div id="locked"><button class="btn big" id="b_unlock"></button></div>
<input type="file" id="file" style="display:none"><input type="file" id="syxfile" style="display:none" accept=".syx,application/octet-stream"><input type="file" id="files" style="display:none" multiple accept="audio/*,.wav">

/* ---- your theme (SLOOP 2.7's 40 bytes; 4.0.8: bytes 34-35 the 4th synth's colour, SLOOP 3's 5th track). TH.trk in the

/* the colours as the FM-1 mixes them (app/ui.c): G(k) the background towards white (0 3 7 15 25 of 32), a track's dim

const hexRGB = h => { const v = parseInt(h.slice(1), 16); return [v >> 16, v >> 8 & 255, v & 255]; };

/* the FM-1's main screen (TRACKS, app/ui.c page_tracks), drawn here with these colours: 240 x 240, at scale z */
function drawHomePreview(cv, z) {

}
/* a sound page (ENV), where the five shades show: rules, labels, values */
function drawPagePreview(cv, z) {

function drawTheme() {

  const r = el('div', 'tools'); const nm = el('input', 'txt'); nm.maxLength = 8; nm.value = TH.name; nm.oninput = () => TH.name = nm.value;

/* main: the tabs, the connection, the state polled, the top bar, the language, the views, the lock. */

  ['samples', '∿', drawSamples], ['mkkit', '▣', drawMkKit], ['kits', '◎', drawKits], ['drumsynth', '◍', drawSyn], ['fm6', '⌁', drawFm6], ['projects', '▤', drawProjects], ['settings', '⚙', drawSettings], ['theme', '◐', drawTheme]];

let tab = 'live';

function showTab(t) {

}
function words2() {

  for (const e of document.querySelectorAll('[data-t]')) e.textContent = L(e.dataset.t);

/* the top bar from the state */
let lastMsg = -1, msgT = 0;

/* polled: ~6 times a second while the page is seen and nothing is being sent */
let polling = 0;
async function poll() {

async function connect() {
